name: Build Assets
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, exif, zip
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build:core
      - run: npm run build
      - run: git diff --exit-code -- packages/core/resources/dist
