name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        dependencies: [locked, compatible]
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pdo_sqlite, bcmath, intl, gd, exif
          coverage: none
      - run: composer validate --strict
      - run: composer --working-dir=packages/core validate --strict
      - if: matrix.dependencies == 'locked'
        run: composer install --prefer-dist --no-interaction
      - if: matrix.dependencies == 'compatible'
        run: composer update --with-all-dependencies --prefer-dist --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer audit --locked
      - run: composer test
