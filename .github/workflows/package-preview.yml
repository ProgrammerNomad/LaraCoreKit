name: Package Release Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, bcmath, intl, gd, exif
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: composer --working-dir=packages/core validate --strict
      - run: composer audit --locked
      - run: composer review
      - run: npm ci
      - run: npm audit
      - run: npm run build:core
      - run: python3 tools/consumer-smoke.py
      - run: python3 tools/package-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: laracorekit-package-preview
          path: storage/app/releases/
          if-no-files-found: error
          retention-days: 14
